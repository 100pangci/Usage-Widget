name: build

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 构建模式
        type: choice
        default: onedir
        options:
          - onedir
          - onefile
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  MODE: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode) || 'onedir' }}

jobs:
  windows:
    name: Windows 构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 计算版本号（标签优先，否则取 pyproject）
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: 构建（PyInstaller）
        shell: cmd
        run: build_windows.bat %MODE%

      - name: 打包 zip
        run: Compress-Archive -Path dist\usage-widget -DestinationPath "usage-widget_${{ steps.ver.outputs.version }}_win.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: usage-widget_${{ steps.ver.outputs.version }}_win.zip
          retention-days: 30

  linux:
    name: Linux 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 计算版本号（标签优先，否则取 pyproject）
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: 构建（PyInstaller）
        run: bash build_linux.sh "$MODE"

      - name: 打包 tar.gz
        run: tar -czf "usage-widget_${{ steps.ver.outputs.version }}_linux.tar.gz" -C dist usage-widget

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: usage-widget_${{ steps.ver.outputs.version }}_linux.tar.gz
          retention-days: 30

  release:
    name: 发布（仅标签触发）
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 生成校验和
        run: |
          sha256sum artifacts/windows/*.zip artifacts/linux/*.tar.gz > checksums.txt
          cat checksums.txt

      - name: 提取 CHANGELOG 对应版本段作为发布说明
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"      # v1.0.0
          VER="${TAG#v}"                       # 1.0.0
          if python3 -c "
          import re, pathlib
          ver = '$VER'
          text = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8')
          m = re.search(r'^## \[\s*v?' + re.escape(ver) + r'\s*\](?:[^\n]*)$', text, re.M)
          if not m:
              raise SystemExit(1)
          start = m.end()
          nxt = re.search(r'^## ', text[start:], re.M)
          end = start + nxt.start() if nxt else len(text)
          pathlib.Path('release-notes.md').write_text(
              text[start:end].strip() + '\n', encoding='utf-8')
          "; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CHANGELOG 中未找到版本 ${VER} 的段落，改用自动生成的发布说明"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建 GitHub Release（CHANGELOG 说明）
        if: steps.changelog.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/*.zip
            artifacts/linux/*.tar.gz
            checksums.txt
          body_path: release-notes.md

      - name: 创建 GitHub Release（自动生成说明，回退）
        if: steps.changelog.outputs.found != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/*.zip
            artifacts/linux/*.tar.gz
            checksums.txt
          generate_release_notes: true
