[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usage-widget"
version = "1.1.2"
description = "可拓展的悬浮窗监控框架"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "psutil>=5.9",
    "certifi>=2023.7.22",
]

[project.scripts]
usage-widget = "main:main"

[tool.setuptools]
packages = ["core", "ui", "plugins", "plugins.clock", "plugins.opencode_usage", "plugins.commandcode", "plugins.system_monitor", "plugins.system_monitor.collector", "plugins.codex_usage"]
py-modules = ["main"]
