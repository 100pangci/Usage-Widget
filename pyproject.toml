[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usage-widget"
version = "1.0.0"
description = "可拓展的悬浮窗监控框架"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
]

[project.scripts]
usage-widget = "main:main"

[tool.setuptools]
packages = ["core", "ui", "plugins", "plugins.clock", "plugins.opencode_usage"]
